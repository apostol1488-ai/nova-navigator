<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Navigator</title>
<meta name="theme-color" content="#22c55e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#f2f4f7;--surf:#fff;--blur:none;--text:#10141a;--muted:#667085;--line:rgba(16,24,40,.09);--chip:#eef1f5;--accent:#22c55e;--sline:rgba(16,24,40,.06);--sh:0 10px 34px rgba(16,24,40,.16);--vbg:#f2f4f7;--r:20px;--nav:60px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);--red:#ef4444}
[data-theme=dark]{--bg:#0e1116;--surf:#181c23;--text:#f3f5f8;--muted:#9aa4b2;--line:rgba(255,255,255,.09);--chip:#242a33;--sline:rgba(255,255,255,.06);--sh:0 10px 34px rgba(0,0,0,.55);--vbg:#0e1116}
[data-style=glass]{--surf:rgba(255,255,255,.5);--blur:blur(22px) saturate(190%);--sline:rgba(255,255,255,.7);--vbg:rgba(244,246,250,.5);--chip:rgba(255,255,255,.5);--line:rgba(16,24,40,.1);--sh:0 10px 40px rgba(16,24,40,.2),inset 0 1px 0 rgba(255,255,255,.75)}
[data-style=glass][data-theme=dark]{--surf:rgba(26,30,38,.5);--sline:rgba(255,255,255,.17);--vbg:rgba(14,17,22,.5);--chip:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--sh:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text",Inter,Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#map{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
.surf{background:var(--surf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--sline);box-shadow:var(--sh);border-radius:var(--r)}
.big{font-size:19px;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:650;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.red{background:var(--red)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none;transition:transform .15s}
.ic:active{transform:scale(.9)}
.x{width:30px;height:30px;border-radius:50%;background:var(--chip);font-size:17px;flex:none;line-height:30px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center}
.empty{color:var(--muted);padding:22px 6px;text-align:center}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:14px;padding:13px 14px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
/* верх */
#navUI{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .3s}
#navUI>*{pointer-events:auto}
body:not(.tab-nav) #navUI{opacity:0}
body:not(.tab-nav) #navUI>*{pointer-events:none}
#top{position:absolute;left:12px;right:12px;top:calc(12px + var(--st));padding:10px;transition:transform .35s cubic-bezier(.3,1,.4,1),opacity .25s}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.td{width:12px;height:12px;border-radius:50%;flex:none;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.td.r{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.pill{flex:1;min-width:0;text-align:left;background:var(--chip);border-radius:13px;padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s}
.pill.muted{color:var(--muted)}
#modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:relative}
#modes button{flex:1;white-space:nowrap;background:var(--chip);border-radius:20px;padding:8px 10px;font-size:13px;font-weight:550;transition:background .25s,color .25s,transform .2s}
#modes button.on{background:var(--accent);color:#fff;transform:scale(1.03)}
#side{position:absolute;right:12px;top:calc(172px + var(--st));display:flex;flex-direction:column;gap:10px;transition:opacity .25s,transform .3s}
.fab{width:46px;height:46px;border-radius:50%;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:transform .15s}
.fab:active{transform:scale(.9)}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#compBtn svg{transition:transform .2s}
#speedo{position:absolute;left:12px;top:calc(172px + var(--st));min-width:64px;padding:8px 12px;text-align:center;display:none;flex-direction:column;line-height:1.05}
#speedo.on{display:flex;animation:pop .3s}
#speedo b{font-size:26px;font-variant-numeric:tabular-nums}
#speedo span{font-size:11px;color:var(--muted)}
/* нижние панели */
.sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 22px + var(--sb));max-height:52vh;overflow:auto;padding:12px 14px;transform:translateY(30px) scale(.98);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.3,1,.4,1),opacity .25s,visibility 0s .35s;overscroll-behavior:contain}
.sheet.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 8px;cursor:pointer}
.rhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.o{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--chip);border:2px solid transparent;transition:border-color .2s,background .2s,transform .15s;animation:pop .3s both}
.o:active{transform:scale(.985)}
.o.sel{border-color:var(--accent)}
.o .ch{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.o .tm{text-align:right;flex:none}
.o .tm b{font-size:17px}
.steps{margin-top:6px}
.step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.step:first-child{border-top:0}
.step .si{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:14px}
.acts{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-12px;padding:10px 0 2px;background:var(--surf);z-index:2}
.acts .btn{flex:1}
.note{font-size:13px;color:var(--muted);padding:6px 0;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.retry{color:var(--accent);font-weight:650;text-decoration:underline}
/* навигация */
#navBanner{position:absolute;left:12px;right:12px;top:calc(12px + var(--st));padding:12px 14px;display:flex;gap:14px;align-items:center;background:var(--accent);color:#fff;border-color:transparent;transform:translateY(-130%);transition:transform .4s cubic-bezier(.3,1,.4,1)}
#navBanner .arr{font-size:44px;line-height:1;width:54px;text-align:center;flex:none}
#navBanner .big{font-size:27px}
#navBanner .sub{color:rgba(255,255,255,.85)}
body.navmode #navBanner{transform:none}
body.navmode #top,body.navmode #rsheet,body.navmode #poi{opacity:0;pointer-events:none;transform:translateY(-130%)}
body.navmode #rsheet{transform:translateY(40px)}
body.navmode #speedo,body.navmode #side{top:calc(122px + var(--st))}
#navBar{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 22px + var(--sb));padding:10px 12px;display:flex;align-items:center;gap:10px;transform:translateY(160%);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.3,1,.4,1),opacity .3s,visibility 0s .4s}
body.navmode #navBar{transform:none;opacity:1;visibility:visible;transition-delay:0s}
#navBar .nbi{flex:1;min-width:0}
/* выбор на карте */
#crosshair{position:fixed;left:50%;top:50%;width:0;height:0;z-index:12;display:none;pointer-events:none}
body.picking #crosshair{display:block}
.cpin{position:absolute;left:-17px;top:-46px;width:34px;height:46px;animation:drop .35s cubic-bezier(.3,1.6,.5,1)}
.cpin:before{content:"";position:absolute;left:3px;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.cpin:after{content:"";position:absolute;left:12px;top:9px;width:10px;height:10px;border-radius:50%;background:#fff}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
body.picking #top,body.picking #side,body.picking #rsheet,body.picking #poi{opacity:0;pointer-events:none}
.opt{display:flex;gap:8px;margin-top:10px}
.opt>*{flex:1}
/* маркеры */
.pin{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);animation:drop .35s}
.pin.g{background:#22c55e}
.pin.y{background:#f59e0b}
.me{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.vb{background:var(--vc,#2563eb);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap}
/* панели-экраны */
.view{position:fixed;inset:0;z-index:20;background:var(--vbg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);overflow:auto;padding:calc(16px + var(--st)) 14px calc(var(--nav) + 40px + var(--sb));opacity:0;visibility:hidden;transform:translateY(18px) scale(.99);transition:opacity .28s,transform .35s cubic-bezier(.3,1,.4,1),visibility 0s .35s}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view h2{margin:2px 0 14px;font-size:26px;letter-spacing:-.4px}
.vhead{display:flex;align-items:center;justify-content:space-between}
.grp{padding:4px 14px;margin-bottom:14px}
.set{padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set>label{display:block;font-weight:650;margin-bottom:9px}
.set.tog{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set.tog>label{margin:0}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:14px;position:relative}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-weight:550;transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--surf);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-style=glass] .seg button.on{background:rgba(255,255,255,.55)}
[data-theme=dark] .seg button.on{background:#323a46}
.sw{display:flex;gap:11px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;transition:transform .2s,border-color .2s}
.sw button.on{border-color:var(--text);transform:scale(1.12)}
.tg{position:relative;width:50px;height:30px;flex:none}
.tg input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:1;cursor:pointer}
.tg i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .25s}
.tg i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg input:checked+i{background:var(--accent)}
.tg input:checked+i:after{transform:translateX(20px)}
.arrows{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.arrows button{aspect-ratio:1;border-radius:14px;background:var(--chip);border:2px solid transparent;display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .2s}
.arrows button.on{border-color:var(--accent);transform:scale(1.06)}
.arrows svg{width:78%;height:78%}
.pbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);animation:pop .3s both}
.li:active{background:var(--chip)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .li-i{width:40px;height:40px;border-radius:13px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chips button{background:var(--chip);border-radius:18px;padding:7px 13px;font-size:13.5px;font-weight:550;transition:transform .15s,background .2s}
.chips button:active{transform:scale(.94)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:active{transform:scale(.97)}
/* схема метро */
#v-metro{display:flex;flex-direction:column}
#schemeBox{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;border-radius:18px;background:var(--chip);margin-top:8px}
#schemeBox svg{width:100%;height:100%;transform-origin:0 0;display:block;user-select:none}
#mres{margin-top:10px;max-height:34vh;overflow:auto;display:none;padding:12px 14px}
#mres.on{display:block;animation:pop .3s}
#msheet{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 26px + var(--sb));display:none;padding:12px 14px;z-index:3}
#msheet.on{display:block;animation:pop .25s}
/* навбар */
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));height:var(--nav);z-index:40;display:flex;padding:6px;border-radius:24px}
#navInd{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:18px;background:color-mix(in srgb,var(--accent) 18%,transparent);transition:transform .4s cubic-bezier(.3,1.25,.5,1)}
#nav button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted);font-weight:600;transition:color .25s}
#nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
#nav button.on{color:var(--accent)}
#nav button.on svg{transform:translateY(-1px) scale(1.12)}
#toast{position:fixed;left:50%;top:calc(80px + var(--st));transform:translate(-50%,-10px);background:rgba(16,20,26,.88);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:70;opacity:0;pointer-events:none;max-width:90%;text-align:center;transition:opacity .25s,transform .25s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{margin-bottom:calc(var(--nav) + 14px + var(--sb));opacity:.75}

#mfields{position:relative;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.mf{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:2px 8px 2px 12px}
.mf input{flex:1;border:0;background:transparent;margin:0;padding:10px 4px;min-width:0;box-shadow:none}
#msug{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;max-height:34vh;overflow:auto;display:none;z-index:5;padding:4px 10px}
#msug.on{display:block;animation:pop .2s}
.hx{border:0;background:transparent;color:var(--muted);font-size:22px;padding:4px 10px;border-radius:10px;flex:none}
.hbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.hbar a{color:var(--accent);font-size:13px;cursor:pointer}
#rsheet.lmin .steps{display:none}
#limit{position:absolute;left:12px;top:calc(238px + var(--st));width:58px;height:58px;border-radius:50%;background:#fff;border:6px solid #e11d48;color:#111;font-weight:800;font-size:22px;display:none;align-items:center;justify-content:center;box-shadow:var(--sh);font-variant-numeric:tabular-nums}
#limit.on{display:flex;animation:pop .3s}
#limit.over{animation:blink .7s infinite;background:#e11d48;color:#fff;border-color:#fff}
#limit small{position:absolute;bottom:-18px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
#overwarn{position:absolute;left:12px;top:calc(312px + var(--st));padding:6px 10px;background:#e11d48;color:#fff;font-weight:700;border-radius:12px;font-size:12px;display:none;box-shadow:var(--sh)}
#overwarn.on{display:block}
body.navmode #limit{top:calc(188px + var(--st))}
body.navmode #overwarn{top:calc(262px + var(--st))}
@keyframes blink{50%{opacity:.55}}
.badge.toll{background:#b45309}
.badge.free{background:#15803d}
.pin.v{background:#8b5cf6}
</style>
</head>
<body class="tab-nav">
<div id="map"></div>
<div id="crosshair"><div class="cpin"></div></div>

<div id="navUI">
  <div id="top" class="surf">
    <div class="trow"><i class="td"></i><button class="pill" id="fromPill"></button><button class="ic" id="swapBtn" aria-label="swap">⇅</button></div>
    <div class="trow"><i class="td r"></i><button class="pill" id="toPill"></button></div>
    <div id="modes"></div>
  </div>
  <div id="side">
    <button id="compBtn" class="fab surf" aria-label="north"><svg viewBox="0 0 24 24"><path d="M12 3l4 9h-8z" fill="currentColor"/><path d="M12 21l-4-9h8z" opacity=".4"/></svg></button>
    <button id="viewBtn" class="fab surf">3D</button>
    <button id="satBtn" class="fab surf" aria-label="satellite">🛰</button>
    <button id="locate" class="fab surf" aria-label="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>
  <div id="speedo" class="surf"><b id="spv">0</b><span id="spu"></span></div>
  <div id="limit"><span id="limv">60</span><small id="limt"></small></div><div id="overwarn"></div>
  <div id="rsheet" class="surf sheet"></div>
  <div id="poi" class="surf sheet"></div>
  <div id="mprompt" class="surf sheet"></div>
  <div id="pickbar" class="surf sheet"><div class="big" id="pickTitle"></div><div class="sub" id="pickAddr" style="min-height:20px"></div><div class="opt"><button class="btn ghost" id="pickCancel"></button><button class="btn" id="pickOk"></button></div></div>
  <div id="navBanner" class="surf"><div class="arr" id="nbArr">↑</div><div style="min-width:0"><div class="big" id="nbDist"></div><div id="nbTxt"></div><div class="sub" id="nbNext"></div></div></div>
  <div id="navBar" class="surf"><div class="nbi"><div class="big" id="nbEta"></div><div class="sub" id="nbRem"></div></div><button id="nbVoice" class="ic">🔊</button><button id="nbEnd" class="btn red"></button></div>
</div>

<section class="view" id="v-search">
  <div class="vhead"><h2 id="qtitle"></h2></div>
  <div class="seg" id="qseg"></div>
  <div class="opt" id="qopts"></div>
  <input type="text" id="q" autocomplete="off" style="margin-top:10px">
  <div id="qchips"></div>
  <div id="qres"></div>
</section>

<section class="view" id="v-favs"></section>

<section class="view" id="v-metro">
  <div class="vhead"><h2 id="mtitle"></h2></div>
  <div class="row" id="mchips" style="flex-wrap:wrap"></div>
  <div id="schemeBox"></div>
  <div id="mfields"><div id="msug" class="surf"></div><div class="mf"><span>🟢</span><input type="text" id="mFrom" autocomplete="off"><button class="x" id="mFromX">×</button></div><div class="mf"><span>🏁</span><input type="text" id="mTo" autocomplete="off"><button class="x" id="mToX">×</button></div></div>
  <div id="mres" class="surf"></div>
  <div id="msheet" class="surf"></div>
</section>

const seg = (k, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button data-k="${k}" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const tog = (id, k, label, sub) => `<div class="set tog"><div><label>${label}</label>${sub ? `<div class="sub">${sub}</div>` : ''}</div><label class="tg"><input type="checkbox" id="${id}" data-tg="${k}" ${S[k] ? 'checked' : ''}><i></i></label></div>`;
function tileRange(b, z) { const n = 2 ** z, X = lon => Math.floor((lon + 180) / 360 * n), Y = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n); }; return {x0: Math.max(0, X(b[0])), x1: Math.min(n - 1, X(b[2])), y0: Math.max(0, Y(b[3])), y1: Math.min(n - 1, Y(b[1]))}; }
function countTiles(b, zmax) { let c = 0; for (let z = 0; z <= Math.min(zmax, 14); z++) { const r = tileRange(b, z); c += (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1); } return c; }
function regBox(r) { if (r[2]) return r[2]; if (!map) return [30.2, 59.9, 30.4, 60]; const b = map.getBounds(); return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]; }
async function renderSettings() {
  const v = $('#v-settings'), off = (await kv.get('offline')) || {};
  v.innerHTML = `<div class="vhead"><h2>${t('nav_settings')}</h2></div>
  <div class="grp surf">
    <div class="set"><label>${t('language')}</label>${seg('lang', [['ru', 'Русский'], ['en', 'English']], S.lang)}</div>
    <div class="set"><label>${t('theme')}</label>${seg('theme', [['auto', t('th_auto')], ['light', t('th_light')], ['dark', t('th_dark')]], S.theme)}</div>
    <div class="set"><label>${t('design')}</label>${seg('style', [['standard', t('st_std')], ['glass', t('st_glass')]], S.style)}</div>
    <div class="set"><label>${t('accent')}</label><div class="sw">${ACCENTS.map(c => `<button data-c="${c}" class="${S.accent === c ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div></div>
  </div>
  <div class="grp surf">
    ${tog('set-d3', 'd3', t('set_3d'))}${tog('set-sat', 'sat', t('set_sat'))}${tog('set-speedo', 'speedo', t('set_speedo'))}${tog('set-voice', 'voice', t('set_voice'))}${tog('set-limit', 'limitWarn', t('set_limit'), t('set_limit_sub'))}${tog('set-trees', 'trees', t('set_trees'))}
    <div class="set"><label>${t('set_arrow')}</label><div class="arrows">${Object.keys(ARROWS).map(k => `<button data-a="${k}" class="${S.arrow === k ? 'on' : ''}">${arrowSvg(k, S.accent, 40)}</button>`).join('')}</div></div>
  </div>
  <div class="grp surf"><div class="set"><label>${t('offline')}</label><div class="sub">${t('offline_hint')}</div>
    ${REGIONS.map(r => { const n = countTiles(regBox(r), r[3]), mb = Math.max(1, Math.round(n * .035)), done = off[r[0]]; return `<div class="li" style="animation:none"><div class="lt"><b>${t(r[1])}</b><span class="sub">≈ ${n} ${t('tiles')}, ~${mb} ${t('mb')}${done ? ' · ✓ ' + new Date(done.ts).toLocaleDateString(S.lang === 'en' ? 'en-GB' : 'ru-RU') : ''}</span></div><button class="btn ghost" data-dl="${r[0]}" style="padding:8px 12px">${done ? t('update') : t('download')}</button></div>`; }).join('')}
    <div class="pbar"><i id="dlBar"></i></div><div class="sub" id="dlState"></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="dlCancel" style="display:none">${t('cancel')}</button><button class="btn ghost" id="dlClear">${t('clear_maps')}</button></div>
  </div></div>
  <div class="grp surf"><div class="set"><label>${t('data')}</label><div class="row"><button class="btn ghost" id="clrTr" style="flex:1">${t('clear_transit')}</button></div><div class="sub" id="stor" style="margin-top:8px"></div></div></div>
  <div class="sub" style="padding:4px 6px 12px">Nova Navigator · © OpenStreetMap, OpenFreeMap, Esri · OSRM</div>`;
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { const el = $('#stor'); if (el) el.textContent = t('storage', Math.round((e.usage || 0) / 1048576)); });
  if (dl) { updDl(); }
}
$('#v-settings').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) { S[b.dataset.k] = b.dataset.v; save(); if (b.dataset.k === 'lang') applyLang(); else { applyTheme(); renderSettings(); } }
  else if (b.dataset.c) { S.accent = b.dataset.c; save(); applyTheme(); renderSettings(); }
  else if (b.dataset.a) { S.arrow = b.dataset.a; save(); placeMe(); renderSettings(); }
  else if (b.dataset.dl) downloadRegion(b.dataset.dl);
  else if (b.id === 'dlClear') clearOffline();
  else if (b.id === 'dlCancel') { if (dl) dl.cancel = true; }
  else if (b.id === 'clrTr') clearTransit();
});
$('#v-settings').addEventListener('change', e => {
  const k = e.target.dataset.tg; if (!k) return; const on = e.target.checked;
  if (k === 'd3') set3D(on); else if (k === 'sat') setSat(on); else { S[k] = on; save(); if (k === 'speedo') updateSpeed(); if (k === 'trees') { lastTree = null; refreshTrees(); } if (k === 'limitWarn') limitTick(); if (k === 'voice') $('#nbVoice').textContent = on ? '🔊' : '🔇'; }
});
async function clearTransit() { const ks = await kv.keys(); for (const k of ks) if (/^(nr3\||geom3\||metro3)/.test(String(k))) await kv.del(k); metroMem = null; toast(t('cleared')); }

/* ================= офлайн-карты ================= */
let dl = null;
function updDl() { if (!dl) return; const bar = $('#dlBar'), s = $('#dlState'), c = $('#dlCancel'); if (!bar) return; bar.style.width = (dl.total ? Math.round(dl.done / dl.total * 100) : 0) + '%'; s.textContent = dl.msg || (t('downloading') + ' ' + dl.done + ' / ' + dl.total); c.style.display = dl.running ? '' : 'none'; }
function fontsOf(base) { const set = new Set(), walk = v => { if (typeof v === 'string') { if (/\s/.test(v) && /[A-Za-z]/.test(v)) set.add(v); } else if (Array.isArray(v)) v.forEach(walk); }; base.layers.forEach(l => l.layout && l.layout['text-font'] && walk(l.layout['text-font'])); return [...set]; }
async function downloadRegion(id) {
  if (dl && dl.running) { toast(t('dl_busy')); return; }
  if (!('caches' in window)) { toast(t('dl_na')); return; }
  const reg = REGIONS.find(r => r[0] === id), bbox = regBox(reg), zmax = reg[3]; dl = {running: true, cancel: false, done: 0, total: 0, msg: t('preparing')}; updDl();
  try {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    const base = await loadBase(), cache = await caches.open('nova-maps'), urls = [], specs = [];
    const put = async u => { try { const r = await fetch(u); if (r.ok) await cache.put(u, r); } catch (e) {} };
    await put(STYLE_URL);
    for (const src of Object.values(base.sources)) {
      if (src.type === 'raster' && !src.url && !src.tiles) continue;
      if (src.url) { const r = await fetch(src.url); await cache.put(src.url, r.clone()); const tj = await r.json(); if (tj.tiles && tj.tiles[0]) specs.push({tiles: tj.tiles[0], min: tj.minzoom || 0, max: tj.maxzoom == null ? 14 : tj.maxzoom}); }
      else if (src.tiles && src.tiles[0]) specs.push({tiles: src.tiles[0], min: src.minzoom || 0, max: src.maxzoom == null ? 14 : src.maxzoom});
    }
    if (base.sprite) ['.json', '.png', '@2x.json', '@2x.png'].forEach(x => urls.push(base.sprite + x));
    if (base.glyphs) fontsOf(base).forEach(f => ['0-255', '256-511', '1024-1279', '8192-8447'].forEach(r => urls.push(base.glyphs.replace('{fontstack}', f).replace('{range}', r))));
    for (const s of specs) for (let z = s.min; z <= Math.min(zmax, s.max); z++) { const r = tileRange(bbox, z); for (let x = r.x0; x <= r.x1; x++) for (let y = r.y0; y <= r.y1; y++) urls.push(s.tiles.replace('{z}', z).replace('{x}', x).replace('{y}', y)); }
    dl.total = urls.length; dl.msg = ''; let idx = 0, fails = 0;
    const worker = async () => { while (!dl.cancel) { const i = idx++; if (i >= urls.length) return; const u = urls[i]; try { if (!(await cache.match(u))) { const r = await fetch(u); if (r.ok) await cache.put(u, r); else fails++; } } catch (e) { fails++; } dl.done++; if (dl.done % 10 === 0) updDl(); } };
    await Promise.all(Array.from({length: 8}, worker));
    if (dl.cancel) { dl.msg = t('dl_cancelled'); }
    else { const off = (await kv.get('offline')) || {}; off[id] = {ts: Date.now(), n: urls.length}; await kv.set('offline', off); dl.msg = t('dl_done', urls.length - fails) + (fails ? ' · ' + t('dl_fails', fails) : ''); }
  } catch (e) { dl.msg = t('dl_err') + ': ' + (e.message || ''); }
  dl.running = false; updDl(); setTimeout(() => { if ($('#v-settings').classList.contains('on')) renderSettings(); }, 1500);
}
async function clearOffline() { try { await caches.delete('nova-maps'); await kv.del('offline'); } catch (e) {} toast(t('cleared')); renderSettings(); }

/* ================= язык и запуск ================= */
function applyLang() {
  document.documentElement.lang = S.lang;
  $$('#nav button').forEach((b, i) => { b.querySelector('span').textContent = t(['nav_map', 'nav_search', 'nav_metro', 'nav_favs', 'nav_settings'][i]); });
  $('#pickCancel').textContent = t('cancel'); $('#pickOk').textContent = t('done'); $('#nbEnd').textContent = t('exit'); $('#nbVoice').textContent = S.voice ? '🔊' : '🔇';
  renderModes(); updateToPill(); updateFromPill(); renderRoute();
  const on = $('.view.on'); if (on) { const n = on.id.slice(2); if (n === 'search') openSearchTab(); else if (n === 'favs') renderFavs(); else if (n === 'settings') renderSettings(); else if (n === 'metro') openMetroTab(); }
}
applyTheme(); applyLang(); $('#viewBtn').textContent = S.d3 ? '3D' : '2D';
if (S.sat) { $('#satBtn').style.color = '#fff'; $('#satBtn').style.background = 'var(--accent)'; }
tab('nav'); initMap(); startGeo();
addEventListener('offline', () => toast(t('offline_now'), 4000));
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').then(r => r.update && r.update()).catch(() => {});

</script>
</body>
